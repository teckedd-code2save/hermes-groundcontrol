# OPTIONAL: use only after deliberate operator consent, in a dedicated profile.
# This example grants nothing and is not applied by the plugin.
# Replace the URL; preserve existing settings. OAuth chooses exact workloads.
# Requires a Hermes build that actually implements MCP trust: untrusted.
# A version string alone is not proof. Verify a write call reaches approval.
# YOLO, approvals off, and remembered Session/Always grants can bypass prompts.
# Use a fresh session and Approve Once for each exact approved write.
mcp_servers:
  groundcontrol:
    url: https://YOUR-GROUNDCONTROL-INSTANCE/mcp
    auth: oauth
    oauth:
      # Keep this stable after registration; choose another unused port if needed.
      redirect_port: 8765
      scope: deployment:read deployment:logs deployment:health deployment:redeploy operation:read offline_access
    trust: untrusted
    tools:
      include:
        - deployment.list
        - deployment.inspect
        - deployment.health
        - deployment.logs
        - deployment.config.check
        - operation.get
        - deployment.source.deploy
        - deployment.redeploy
        - deployment.restart
        - deployment.build_publish
        - deployment.release
