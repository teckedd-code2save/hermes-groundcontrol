# Merge deliberately into the selected Hermes profile. Never overwrite an existing config.
# Replace the URL with your instance. OAuth consent is a separate human approval.
mcp_servers:
  groundcontrol:
    url: https://YOUR-GROUNDCONTROL-INSTANCE/mcp
    auth: oauth
    oauth:
      # Keep this stable after registration; choose another unused port if needed.
      redirect_port: 8765
      scope: deployment:read deployment:logs deployment:health operation:read offline_access
    tools:
      include:
        - deployment.list
        - deployment.inspect
        - deployment.health
        - deployment.logs
        - deployment.config.check
        - operation.get
